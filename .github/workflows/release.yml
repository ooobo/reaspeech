name: Create ReaPack Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-bundle:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set version from tag
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ github.event.inputs.version }}"
        } else {
          $VERSION = "${{ github.ref_name }}"
        }
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $VERSION"

    - name: Build ReaSpeech bundle
      run: |
        $VERSION = "${{ steps.version.outputs.VERSION }}"

        cd reascripts/ReaSpeech
        $bundleContent = @(
          "source/include/header.lua",
          "source/include/globals.lua",
          "vendor/json.lua",
          "vendor/url.lua"
        )
        $bundleContent += Get-ChildItem -Path "resources/images" -Filter "*.lua" | ForEach-Object { $_.FullName }
        $bundleContent += Get-ChildItem -Path "source/libs" -Filter "*.lua" -Recurse | ForEach-Object { $_.FullName }
        $bundleContent += Get-ChildItem -Path "source/ui" -Filter "*.lua" -Recurse | ForEach-Object { $_.FullName }
        $bundleContent += Get-ChildItem -Path "source/main" -Filter "*.lua" -Recurse | ForEach-Object { $_.FullName }
        $bundleContent += "version.lua"
        $bundleContent += "source/include/main.lua"
        New-Item -ItemType Directory -Path build -Force | Out-Null
        Get-Content $bundleContent | Set-Content -Path "build/ReaSpeechBundle.lua" -Encoding UTF8

        "-- @description ReaSpeech - Speech recognition for REAPER" | Set-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "-- @version $VERSION" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "-- @author ReaSpeech Contributors" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "-- @about" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "--   # ReaSpeech" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "--   Speech recognition tool for REAPER using Parakeet ASR" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "-- ReaSpeech production configuration" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "Script = {" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        '  name = "ReaSpeech",' | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "  executable_path = nil," | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        '  env = "production",' | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "  lua = _VERSION:match('[%d.]+')," | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "  timeout = 30000," | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "}" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        "" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8
        Get-Content "build/ReaSpeechBundle.lua" | Add-Content -Path "build/ReaSpeech.lua" -Encoding UTF8

    - name: Upload bundle artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bundle-files
        path: |
          reascripts/ReaSpeech/build/ReaSpeech.lua
          reascripts/ReaSpeech/resources/

  create-release:
    needs: [build-bundle]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Download bundle artifacts
      uses: actions/download-artifact@v4
      with:
        name: bundle-files
        path: bundle-files

    - name: Download latest parakeet-transcribe binaries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p parakeet-binaries

        # Get the latest release info from ooobo/parakeet-transcribe
        RELEASE_INFO=$(curl -s https://api.github.com/repos/ooobo/parakeet-transcribe/releases/latest)
        RELEASE_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
        echo "Fetching parakeet-transcribe binaries from release: $RELEASE_TAG"

        # Download all release assets
        ASSETS=$(echo "$RELEASE_INFO" | jq -r '.assets[] | "\(.name) \(.browser_download_url)"')
        while IFS=' ' read -r name url; do
          echo "Downloading $name..."
          curl -sL -o "parakeet-binaries/$name" "$url"
        done <<< "$ASSETS"

        echo "Downloaded binaries:"
        ls -lah parakeet-binaries/

    - name: Debug - List artifact contents
      run: |
        echo "=== Bundle files ==="
        find bundle-files -type f -o -type d
        echo ""
        echo "=== Parakeet binaries ==="
        ls -lah parakeet-binaries/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets

        # Main script (from bundle build)
        find bundle-files -name "ReaSpeech.lua" -type f -exec cp {} release-assets/ \;

        # Parakeet binaries from external repo
        [ -f parakeet-binaries/parakeet-transcribe.exe ] && cp parakeet-binaries/parakeet-transcribe.exe release-assets/
        [ -f parakeet-binaries/parakeet-transcribe-macos ] && cp parakeet-binaries/parakeet-transcribe-macos release-assets/ && chmod +x release-assets/parakeet-transcribe-macos

        # Resources (find the resources directory)
        RESOURCES_DIR=$(find bundle-files -type d -name "resources" | head -1)
        if [ -n "$RESOURCES_DIR" ]; then
          cp -r "$RESOURCES_DIR" release-assets/

          # Copy individual resource files to release root for ReaPack URLs (if they exist)
          [ -f release-assets/resources/images/icon.lua ] && cp release-assets/resources/images/icon.lua release-assets/icon.lua || true
          [ -f release-assets/resources/images/spinner.lua ] && cp release-assets/resources/images/spinner.lua release-assets/spinner.lua || true
        fi

        ls -lah release-assets/
        echo "Resources:"
        ls -lah release-assets/resources/images/ || echo "No resources/images directory found"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: ReaSpeech ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        body: |
          Speech recognition for REAPER using Parakeet ASR.

          ## Installation

          ### Via ReaPack (Recommended)
          1. In REAPER, go to Extensions > ReaPack > Import repositories
          2. Add: `https://github.com/ooobo/reaspeech/raw/beta/index.xml`
          3. Browse packages and install "ReaSpeech"
          4. ReaPack will download all platform-specific files automatically

          ### Manual Installation
          Download ReaSpeech.lua and the executable for your platform,
          move to `Scripts/` or folder of your choice, then
          load as a ReaScript in REAPER.

          ## What's New
          - See commits for detailed changes
        files: |
          release-assets/ReaSpeech.lua
          release-assets/parakeet-transcribe.exe
          release-assets/parakeet-transcribe-macos
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update index.xml for ReaPack
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        VERSION_NAME="${VERSION#v}"
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        REPO_URL="https://github.com/ooobo/reaspeech/releases/download/${VERSION}"

        # Create new version entry file
        cat > /tmp/new_version.xml << ENDVERSION
          <version name="${VERSION_NAME}" author="ooobo" time="${TIMESTAMP}">
            <changelog><![CDATA[Release ${VERSION}]]></changelog>
            <source main="main">${REPO_URL}/ReaSpeech.lua</source>
            <source platform="windows" file="parakeet-transcribe.exe">${REPO_URL}/parakeet-transcribe.exe</source>
            <source platform="darwin" file="parakeet-transcribe-macos">${REPO_URL}/parakeet-transcribe-macos</source>
          </version>
        ENDVERSION

        # Insert after </metadata> tag
        sed -i '/<\/metadata>/r /tmp/new_version.xml' index.xml

        echo "Added version ${VERSION_NAME} to index.xml"
        cat index.xml

    - name: Commit and push index.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.xml
        git commit -m "Update index.xml for ${{ steps.version.outputs.VERSION }}"
        git push origin HEAD:beta
