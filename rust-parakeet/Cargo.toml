[package]
name = "parakeet-transcribe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "parakeet-transcribe-macos"
path = "src/main.rs"

[[bin]]
name = "parakeet-transcribe-windows"
path = "src/main.rs"

[dependencies]
parakeet-rs = { path = "parakeet-rs-fork" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
eyre = "0.6"
hf-hub = "0.4"
dirs = "5.0"
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
